<h1>{{ title }} </h1>

<h2>Task List</h2>

<p>Coins: {{ coins }}</p>

<input [(ngModel)]="task">

<button (click)="addTask()">
Add
</button>

<ul>
  <li *ngFor="let item of tasks; let i = index">
    {{ item }}
    <button (click)="removeTask(i)">
      Delete
    </button>
  </li>
</ul>

<button (click)="addCoins(1)">
  Add Coin
</button>

<button (click)="resetCoins()">
  Reset Coins
</button>
